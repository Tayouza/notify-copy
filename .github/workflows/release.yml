name: Release

# Gera os instaladores nos 3 SOs (Linux/Windows/macOS) e, se rodado a partir de
# uma tag, anexa numa GitHub Release.
#
# Como rodar: aba Actions → "Release" → "Run workflow".
#   - Em um branch: só gera os artefatos para download (não cria release).
#   - Em uma tag (ex.: v0.1.0): cria/atualiza a Release com os instaladores,
#     incluindo o .dmg do macOS (que não é possível gerar no Linux).
#
# O disparo automático por push de tag está desativado de propósito, para não
# interferir em publicações manuais.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish never: sem tag o electron-builder não publica, mas COM tag ele
      # ativa publish automático ("onTag") e tenta criar a Release com o token
      # deste job (que é só de leitura) → 403 e o build falha. A publicação é
      # feita pelo job "Publicar release" abaixo, então desligamos aqui.
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Não tenta assinar no macOS (sem certificado no repositório)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
